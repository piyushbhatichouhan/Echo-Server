services:
  postgres:
    image: postgres:17

    container_name: echo-dev-postgres

    restart: unless-stopped

    env_file:
      - ./backend/.env

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile

    container_name: echo-dev-backend

    env_file:
      - ./backend/.env

    depends_on:
      - postgres

    ports:
      - "3000:3000"

    volumes:
      - "D:/Echostorage:/storage"
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  postgres_data:
